name: ✨ Feature Request
description: Suggest an idea or enhancement for RxAnvaya
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new idea or improvement for RxAnvaya!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or user challenge?
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
      placeholder: It would be great if RxAnvaya could...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Diagnostic Panels / Lab Tests
        - Language Support (Regional Indian & Global)
        - Patient Accessibility / UI
        - Voice Agent & Audio
        - Provider / Doctor Tools
        - Health Integration (ABDM / FHIR)
