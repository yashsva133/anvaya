name: 🐛 Bug Report
description: Report an issue or bug in RxAnvaya
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and fix it.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Go to '/upload'
        2. Upload sample report 'report1.png'
        3. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected Component
      options:
        - Report Ingestion / OCR
        - AI Companion / Chat
        - Voice Agent
        - Translations / Multilingual
        - Trends & Visualizations
        - Authentication & Supabase
        - UI / Layout / Responsiveness
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Browser, OS, Node version, device.
      placeholder: Chrome 124 on Windows 11, Node 20.10.0
