<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0B2A4A" />
      <stop offset="100%" stopColor="#0F766E" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#f8fafc" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="36" fill="url(#bgGrad)" />

  <!-- Ambient glowing rings -->
  <circle cx="400" cy="400" r="320" stroke="#5EEAD4" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="8 12" />
  <circle cx="400" cy="400" r="240" stroke="#5EEAD4" stroke-opacity="0.2" stroke-width="2" />

  <!-- Center Main Lab Report Card -->
  <g filter="url(#cardShadow)">
    <rect x="200" y="140" width="400" height="520" rx="28" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="2" />
    
    <!-- Report Header -->
    <rect x="236" y="176" width="48" height="48" rx="14" fill="#0B2A4A" />
    <path d="M255 190h10v6h6v10h-6v6h-10v-6h-6v-10h6v-6Z" fill="#fff" />
    <rect x="300" y="184" width="160" height="14" rx="7" fill="#0F172A" />
    <rect x="300" y="206" width="100" height="10" rx="5" fill="#94A3B8" />

    <line x1="236" y1="244" x2="564" y2="244" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Test Item 1: report result -->
    <g transform="translate(236, 264)">
      <rect width="328" height="74" rx="18" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1.5" />
      <circle cx="36" cy="37" r="18" fill="#FFE4E6" />
      <path d="M36 26c-4 5-8 10-8 14a8 8 0 0 0 16 0c0-4-4-9-8-14z" fill="#E11D48" />
      <text x="68" y="32" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#1E293B">Lab result</text>
      <text x="68" y="52" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#E11D48">Needs a closer look</text>
      <rect x="236" y="24" width="76" height="26" rx="13" fill="#E11D48" />
      <text x="274" y="41" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">Low</text>
    </g>

    <!-- Test Item 2: Fasting Blood Sugar -->
    <g transform="translate(236, 352)">
      <rect width="328" height="74" rx="18" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5" />
      <circle cx="36" cy="37" r="18" fill="#DCFCE7" />
      <path d="M30 37a6 6 0 1 0 12 0 6 6 0 0 0-12 0Z" fill="#16A34A" />
      <text x="68" y="32" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#1E293B">Lab result</text>
      <text x="68" y="52" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#16A34A">Within printed range</text>
      <rect x="236" y="24" width="76" height="26" rx="13" fill="#16A34A" />
      <text x="274" y="41" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">Normal</text>
    </g>

    <!-- Test Item 3: HbA1c -->
    <g transform="translate(236, 440)">
      <rect width="328" height="74" rx="18" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5" />
      <circle cx="36" cy="37" r="18" fill="#FEF3C7" />
      <path d="M36 27l2 6h6l-5 4 2 6-5-4-5 4 2-6-5-4h6z" fill="#D97706" />
      <text x="68" y="32" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#1E293B">Lab result</text>
      <text x="68" y="52" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#D97706">Needs explanation</text>
      <rect x="236" y="24" width="76" height="26" rx="13" fill="#D97706" />
      <text x="274" y="41" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">Attention</text>
    </g>

    <!-- Bottom Audio Explanation Pill -->
    <g transform="translate(236, 532)">
      <rect width="328" height="60" rx="18" fill="#0B2A4A" />
      <circle cx="32" cy="30" r="14" fill="#0F766E" />
      <path d="M30 24v12l6-6-6-6Z" fill="#5EEAD4" />
      <text x="58" y="27" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#5EEAD4">Rxअन्वय AI Assistant</text>
      <text x="58" y="45" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#E2E8F0">“Your results explained in simple Hindi / English”</text>
    </g>
  </g>
</svg>
